name: CI

on:
  push:
    branches: [development, main, template]
  pull_request:
    branches: [development, main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pcntl
          tools: pint, phpstan
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

  tests:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test --compact

  dusk:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Upgrade Chrome Driver
        run: php artisan dusk:chrome-driver --detect

      - name: Set Chrome Driver permissions
        run: chmod -R 0755 vendor/laravel/dusk/bin/

      - name: Create SQLite database
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Start Laravel server
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/ci-server.log 2>&1 &
          echo $! > /tmp/server.pid
        shell: bash {0}

      - name: Wait for server
        run: |
          sleep 5
          for i in {1..60}; do
            if curl --silent http://127.0.0.1:8000 >/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Laravel server did not become ready in time."
          cat storage/logs/ci-server.log
          exit 1

      - name: Dusk Tests
        env:
          APP_URL: http://127.0.0.1:8000
        run: php artisan dusk

      - name: Upload Dusk screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots
          if-no-files-found: ignore

      - name: Upload Dusk console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-console
          path: tests/Browser/console
          if-no-files-found: ignore

      - name: Stop Laravel server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi
